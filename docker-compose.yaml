version: '3.8'

services:
  app:
    build: .
    container_name: fiber-ee
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - DATABASE_DRIVER=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=fiber_ee
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fiber-net

  postgres:
    image: postgres:16-alpine
    container_name: fiber-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiber_ee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fiber-net

  redis:
    image: redis:7-alpine
    container_name: fiber-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fiber-net

  # 可选: Jaeger 链路追踪
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: fiber-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP HTTP
    profiles:
      - tracing
    networks:
      - fiber-net

  # 可选: Prometheus + Grafana
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fiber-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    networks:
      - fiber-net

  grafana:
    image: grafana/grafana:10.2.2
    container_name: fiber-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring
    networks:
      - fiber-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  fiber-net:
    driver: bridge
